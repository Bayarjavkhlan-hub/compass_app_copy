appId: com.example.compassApp
name: Search does nothing until the form is complete
tags:
  - regression
---
- launchApp:
    clearState: true
- tapOn:
    id: home_book_new_trip
- runFlow: ../subflows/assert_search_blocked.yaml

# Continent alone is not enough
- tapOn:
    id: search_continent_asia
- runFlow: ../subflows/assert_search_blocked.yaml

# Guests counter cannot go below zero
- tapOn:
    id: search_guests_remove
- assertVisible:
    id: search_guests_count
    text: "0"
- tapOn:
    id: search_guests_add
- assertVisible:
    id: search_guests_count
    text: "1"
- runFlow: ../subflows/assert_search_blocked.yaml

# Back navigation returns home without saving
- tapOn:
    id: nav_home
- assertVisible: "Sofie's Trips"
