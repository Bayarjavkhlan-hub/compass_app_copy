name: Maestro E2E

# The same .maestro/ flows run on an Android emulator and an iOS simulator.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 2 * * *" # nightly, 02:00 UTC
  workflow_dispatch:

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.5"
  MAESTRO_VERSION: "2.12.1"

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build debug APK (development flavor, local data)
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --debug -t lib/main_development.dart

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run flows on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: adb install app/build/app/outputs/flutter-apk/app-debug.apk && bash .github/scripts/run_maestro.sh android

      - name: Upload report and debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android
          path: |
            reports/
            maestro-debug/
          if-no-files-found: ignore

  ios:
    name: iOS simulator
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Simulator builds need no code signing or Apple developer account.
      - name: Build simulator app (development flavor, local data)
        working-directory: app
        run: |
          flutter pub get
          flutter build ios --simulator --debug -t lib/main_development.dart

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot iPhone simulator and install app
        run: |
          # Newest available iPhone, so the job survives Xcode image updates.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" app/build/ios/iphonesimulator/Runner.app

      - name: Run flows on simulator
        run: bash .github/scripts/run_maestro.sh ios

      - name: Upload report and debug output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-ios
          path: |
            reports/
            maestro-debug/
          if-no-files-found: ignore

  report:
    name: Test report
    needs: [android, ios]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      issues: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: maestro-*
          merge-multiple: true

      # Per-flow results as a check run and in the job summary.
      - name: Publish JUnit results
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/*.xml
          check_name: Maestro results
          detailed_summary: true
          include_passed: true

      # Alert: nightly/main failures open (or comment on) one tracking issue.
      - name: Open or update failure issue
        if: >-
          (needs.android.result == 'failure' || needs.ios.result == 'failure')
          && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Maestro E2E failed on \`${{ github.event_name }}\` (${GITHUB_SHA::7}).
          Android: ${{ needs.android.result }} · iOS: ${{ needs.ios.result }}
          Run, report and screenshots: $RUN_URL"
          existing=$(gh issue list --state open --search "in:title Maestro E2E failing" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Maestro E2E failing" --body "$body"
          fi
